<svg xmlns="http://www.w3.org/2000/svg" width="2010" height="990" viewBox="0 0 2010 990" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect width="2010" height="990" fill="#ffffff"/><text x="30" y="46" font-size="30" font-weight="800" fill="#0f172a">AI-Powered Sensitive Personal Information Detection &amp; Redaction Utility</text>
<text x="30" y="74" font-size="16" fill="#475569">Solution architecture - LangGraph stateful pipeline with human-in-the-loop approval, in-memory processing, hybrid RAG and guardrails</text>
<rect x="30" y="110" width="260" height="250" rx="12" fill="#eef0ff" stroke="#4f5bd5" stroke-width="2"/>
<text x="278" y="348" text-anchor="end" font-size="12" font-weight="600" fill="#4f5bd5" letter-spacing="0.5">RBAC</text>
<text x="44" y="140" font-size="18" font-weight="700" fill="#2f3a9e">Users &amp; access</text>
<text x="44" y="166" font-size="15" fill="#1f2937" font-weight="600">Analyst</text>
<text x="44" y="188" font-size="15" fill="#1f2937">scan, review, submit</text>
<text x="44" y="210" font-size="15" fill="#1f2937" font-weight="600">Compliance Officer</text>
<text x="44" y="232" font-size="15" fill="#1f2937">approve, purge, audit trail</text>
<text x="44" y="254" font-size="15" fill="#1f2937">Login: PBKDF2 hashes,</text>
<text x="44" y="276" font-size="15" fill="#1f2937">lockout, session timeout</text>
<text x="44" y="298" font-size="15" fill="#1f2937">Production: Entra ID SSO</text>
<rect x="30" y="400" width="260" height="210" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="278" y="598" text-anchor="end" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">INPUT</text>
<text x="44" y="430" font-size="18" font-weight="700" fill="#334155">Document sources</text>
<text x="44" y="456" font-size="15" fill="#1f2937">Upload (drag &amp; drop)</text>
<text x="44" y="478" font-size="15" fill="#1f2937">Local folder (bulk, sub-folders)</text>
<text x="44" y="500" font-size="15" fill="#1f2937">Microsoft 365 via Graph API</text>
<text x="44" y="522" font-size="15" fill="#1f2937">(OneDrive / SharePoint)</text>
<text x="44" y="544" font-size="15" fill="#1f2937" font-weight="600">docx xlsx pptx pdf txt csv eml</text>
<rect x="320" y="110" width="1380" height="82" rx="12" fill="#eef0ff" stroke="#4f5bd5" stroke-width="2"/>
<text x="1688" y="180" text-anchor="end" font-size="12" font-weight="600" fill="#4f5bd5" letter-spacing="0.5">UI</text>
<text x="334" y="140" font-size="18" font-weight="700" fill="#2f3a9e">Streamlit UI</text>
<text x="334" y="166" font-size="15" fill="#1f2937">1 Select &amp; scan   |   2 Review &amp; approve (highlights, approve / reject, add missed text)   |   3 Results &amp; reports   |   4 Policy assistant   |   5 Audit trail (Compliance only)</text>
<rect x="320" y="220" width="1380" height="400" rx="16" fill="none" stroke="#0f8b7d" stroke-width="2" stroke-dasharray="10 7"/>
<text x="338" y="244" font-size="14" font-weight="700" fill="#0f8b7d" letter-spacing="0.6">IN-MEMORY PROCESSING BOUNDARY - LangGraph StateGraph + InMemorySaver checkpointer - no document content written to disk, purge on demand</text>
<rect x="345" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="359" y="292" font-size="17" font-weight="700" fill="#0b5f56">1  extract</text>
<text x="359" y="318" font-size="14" fill="#1f2937">Parse file into</text>
<text x="359" y="339" font-size="14" fill="#1f2937">addressable segments</text>
<rect x="570" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="584" y="292" font-size="17" font-weight="700" fill="#0b5f56">2  detect</text>
<text x="584" y="318" font-size="14" fill="#1f2937">PI candidates with</text>
<text x="584" y="339" font-size="14" fill="#1f2937">confidence + reason</text>
<rect x="795" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="809" y="292" font-size="17" font-weight="700" fill="#0b5f56">3  llm_review</text>
<text x="809" y="318" font-size="14" fill="#1f2937">Validate low-confidence,</text>
<text x="809" y="339" font-size="14" fill="#1f2937">find contextual PI</text>
<rect x="1020" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="1034" y="292" font-size="17" font-weight="700" fill="#0b5f56">4  human_review</text>
<text x="1034" y="318" font-size="14" fill="#1f2937">interrupt() - waits</text>
<text x="1034" y="339" font-size="14" fill="#1f2937">for approval</text>
<rect x="1245" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="1259" y="292" font-size="17" font-weight="700" fill="#0b5f56">5  redact</text>
<text x="1259" y="318" font-size="14" fill="#1f2937">Format-native,</text>
<text x="1259" y="339" font-size="14" fill="#1f2937">layout preserved</text>
<rect x="1470" y="262" width="200" height="104" rx="12" fill="#e6f6f4" stroke="#0f8b7d" stroke-width="2"/>
<text x="1484" y="292" font-size="17" font-weight="700" fill="#0b5f56">6  verify &amp; report</text>
<text x="1484" y="318" font-size="14" fill="#1f2937">Re-scan output for</text>
<text x="1484" y="339" font-size="14" fill="#1f2937">residual PI</text>
