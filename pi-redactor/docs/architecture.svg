<rect x="320" y="660" width="675" height="190" rx="12" fill="#e8f3ff" stroke="#2f7dd1" stroke-width="2"/>
<text x="983" y="838" text-anchor="end" font-size="12" font-weight="600" fill="#2f7dd1" letter-spacing="0.5">RETRIEVAL</text>
<text x="334" y="690" font-size="18" font-weight="700" fill="#1b528f">Hybrid RAG - privacy policy knowledge base</text>
<text x="334" y="716" font-size="14" fill="#1f2937" font-weight="600">Policies (markdown): PI tiers, redaction standard, GDPR / DPDP / CCPA / HIPAA</text>
<text x="334" y="737" font-size="14" fill="#1f2937">Embeddings: azure/genailab-maas-text-embedding-3-large</text>
<text x="334" y="758" font-size="14" fill="#1f2937">Vector DB: ChromaDB (in-memory)  +  BM25 keyword index</text>
<text x="334" y="779" font-size="14" fill="#1f2937">Reciprocal-rank fusion  -&gt;  Cross-encoder re-ranking (ms-marco-MiniLM)</text>
<text x="334" y="800" font-size="14" fill="#1f2937">Grounds the LLM review agent and the policy assistant</text>
<rect x="1020" y="660" width="425" height="190" rx="12" fill="#ffeef0" stroke="#d6455d" stroke-width="2"/>
<text x="1433" y="838" text-anchor="end" font-size="12" font-weight="600" fill="#d6455d" letter-spacing="0.5">SAFETY</text>
<text x="1034" y="690" font-size="18" font-weight="700" fill="#99223a">NeMo Guardrails + Policy assistant</text>
<text x="1034" y="716" font-size="14" fill="#1f2937">Input rail: self-check (jailbreak / PI requests)</text>
<text x="1034" y="737" font-size="14" fill="#1f2937">Output rail: self-check + Presidio PI masking</text>
<text x="1034" y="758" font-size="14" fill="#1f2937">Heuristic prompt-injection blocking</text>
<text x="1034" y="779" font-size="14" fill="#1f2937">Grounded answers with cited policy sections</text>
<rect x="1470" y="660" width="230" height="190" rx="12" fill="#fdf8e4" stroke="#b8930b" stroke-width="2"/>
<text x="1688" y="838" text-anchor="end" font-size="12" font-weight="600" fill="#b8930b" letter-spacing="0.5">QUALITY</text>
<text x="1484" y="690" font-size="18" font-weight="700" fill="#7a6107">Evaluation</text>
<text x="1484" y="716" font-size="14" fill="#1f2937">RAGAS: faithfulness,</text>
<text x="1484" y="737" font-size="14" fill="#1f2937">relevancy, context</text>
<text x="1484" y="758" font-size="14" fill="#1f2937">precision / recall</text>
<text x="1484" y="779" font-size="14" fill="#1f2937">Detection P / R / F1</text>
<text x="1484" y="800" font-size="14" fill="#1f2937">pytest (19 tests)</text>
