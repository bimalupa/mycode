<text x="783" y="256" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">if LLM enabled</text>
<rect x="345" y="405" width="425" height="200" rx="12" fill="#fff3e6" stroke="#e07b12" stroke-width="2"/>
<text x="758" y="593" text-anchor="end" font-size="12" font-weight="600" fill="#e07b12" letter-spacing="0.5">DATA PROTECTION</text>
<text x="359" y="435" font-size="18" font-weight="700" fill="#9a4f00">Detection engine</text>
<text x="359" y="461" font-size="14" fill="#1f2937" font-weight="600">Microsoft Presidio + spaCy en_core_web_lg</text>
<text x="359" y="482" font-size="14" fill="#1f2937">Custom recognizers: Aadhaar, PAN, passport,</text>
<text x="359" y="503" font-size="14" fill="#1f2937">phone, street address, employee ID, keywords</text>
<text x="359" y="524" font-size="14" fill="#1f2937">Spreadsheet column-header awareness</text>
<text x="359" y="545" font-size="14" fill="#1f2937">Document-wide value propagation</text>
<text x="359" y="566" font-size="14" fill="#1f2937">Pattern-over-NER overlap resolution</text>
<rect x="795" y="405" width="200" height="200" rx="12" fill="#f4ecff" stroke="#8b5cf6" stroke-width="2"/>
<text x="983" y="593" text-anchor="end" font-size="12" font-weight="600" fill="#8b5cf6" letter-spacing="0.5">AI</text>
<text x="809" y="435" font-size="18" font-weight="700" fill="#5b2bb5">LLM review agent</text>
<text x="809" y="461" font-size="14" fill="#1f2937" font-weight="600">Azure GenAI Lab</text>
<text x="809" y="482" font-size="14" fill="#1f2937" font-weight="600">gpt-4o-mini</text>
<text x="809" y="503" font-size="14" fill="#1f2937">Confident PI masked</text>
<text x="809" y="524" font-size="14" fill="#1f2937">before sending</text>
<text x="809" y="545" font-size="14" fill="#1f2937">Accept only text found</text>
<text x="809" y="566" font-size="14" fill="#1f2937">verbatim (no halluc.)</text>
<rect x="1020" y="405" width="200" height="200" rx="12" fill="#eef0ff" stroke="#4f5bd5" stroke-width="2"/>
<text x="1208" y="593" text-anchor="end" font-size="12" font-weight="600" fill="#4f5bd5" letter-spacing="0.5">HITL</text>
<text x="1034" y="435" font-size="18" font-weight="700" fill="#2f3a9e">Maker-checker</text>
<text x="1034" y="461" font-size="14" fill="#1f2937">Analyst submits</text>
<text x="1034" y="482" font-size="14" fill="#1f2937">Compliance approves</text>
<text x="1034" y="503" font-size="14" fill="#1f2937">Untick false positives,</text>
<text x="1034" y="524" font-size="14" fill="#1f2937">add missed terms,</text>
<text x="1034" y="545" font-size="14" fill="#1f2937">bulk approve</text>
<text x="1034" y="566" font-size="14" fill="#1f2937">Shared review queue</text>
<rect x="1245" y="405" width="425" height="200" rx="12" fill="#fff3e6" stroke="#e07b12" stroke-width="2"/>
<text x="1658" y="593" text-anchor="end" font-size="12" font-weight="600" fill="#e07b12" letter-spacing="0.5">DATA PROTECTION</text>
<text x="1259" y="435" font-size="18" font-weight="700" fill="#9a4f00">Format handlers &amp; redaction</text>
<text x="1259" y="461" font-size="14" fill="#1f2937" font-weight="600">Word, PowerPoint (run-level), Excel (cell-level)</text>
<text x="1259" y="482" font-size="14" fill="#1f2937" font-weight="600">PDF true redaction (PyMuPDF), Email (.eml)</text>
<text x="1259" y="503" font-size="14" fill="#1f2937">Styles: [PERSON_1] labels | blackout | [REDACTED]</text>
<text x="1259" y="524" font-size="14" fill="#1f2937">Metadata scrub, mailto links neutralised</text>
<text x="1259" y="545" font-size="14" fill="#1f2937">Post-redaction verification (residual check)</text>
<text x="1259" y="566" font-size="14" fill="#1f2937">Prompt-injection screening of document text</text>
