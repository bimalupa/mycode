<text x="1744" y="229" font-size="14" fill="#1f2937">No PI under PDF boxes</text>
<rect x="1730" y="305" width="250" height="150" rx="12" fill="#eaf7ec" stroke="#2e9e4f" stroke-width="2"/>
<text x="1968" y="443" text-anchor="end" font-size="12" font-weight="600" fill="#2e9e4f" letter-spacing="0.5">OUTPUT</text>
