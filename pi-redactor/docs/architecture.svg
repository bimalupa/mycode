<text x="30" y="950" font-size="14" fill="#64748b">Stack: LangGraph | Azure GenAI Lab gpt-4o-mini + text-embedding-3-large | ChromaDB | BM25 + semantic + cross-encoder | Microsoft Presidio | NeMo Guardrails | RAGAS | Python logging | Streamlit</text></svg>