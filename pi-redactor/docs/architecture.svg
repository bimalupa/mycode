<text x="1744" y="557" font-size="14" fill="#1f2937">Login, scan, submit, approve,</text>
<text x="1744" y="578" font-size="14" fill="#1f2937">redact, purge, export events</text>
<text x="1744" y="599" font-size="14" fill="#1f2937">HMAC fingerprints, no raw PI</text>
<text x="1744" y="620" font-size="14" fill="#1f2937" font-weight="600">Compliance Officer only</text>
